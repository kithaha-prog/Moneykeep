:root[data-theme="sand"]{color-scheme:light;--paper:#F1EAD9;--card:#FAF5E8;--ink:#2E2A1F;--mute:#7A7360;--line:#DDD3BA;--seal:#B8641F;--on-seal:#FFF7EA;--inc:#3F7D4F}

/* 兜底 */
:root:not([data-theme]){--paper:#EDF0E9;--card:#F7F9F4;--ink:#1B2B34;--mute:#66767A;--line:#CED6CF;--seal:#BF3B36;--on-seal:#FFF6F2;--inc:#2B7A64}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans);overscroll-behavior:none;touch-action:manipulation}
input,select,textarea{font-family:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;user-select:none;-webkit-user-select:none}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- 主界面（不滚动） ---------- */
#app{height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 20px calc(env(safe-area-inset-bottom) + 14px);overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.date b{display:block;font-family:var(--serif);font-size:18px;font-weight:700}
.date span{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.hr{display:flex;gap:8px;align-items:center}
.gear{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);font-size:17px;display:grid;place-items:center;color:var(--mute)}
.curpill{border:1.5px solid var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.curpill i{font-style:normal;font-size:10px;opacity:.7}

.hero{margin-top:clamp(6px,1.8dvh,20px)}
.hero .lab{font-size:13px;color:var(--mute)}
.big{display:flex;align-items:baseline;gap:6px;margin-top:2px;line-height:1}
.big small{font-family:var(--serif);font-size:22px;font-weight:700}
.big span{font-family:var(--serif);font-weight:700;font-size:clamp(44px,8.6dvh,66px);letter-spacing:-.5px;font-variant-numeric:tabular-nums}

.seg{display:flex;gap:4px;margin-top:clamp(8px,2dvh,20px);border-bottom:1px solid var(--line)}
.seg button{padding:7px 12px 9px;font-size:13.5px;color:var(--mute);position:relative}
.seg button[aria-pressed="true"]{color:var(--ink);font-weight:700}
.seg button[aria-pressed="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2.5px;background:var(--seal);border-radius:2px}
.stats{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:10px;margin-top:10px;align-items:end}
.stats .k{font-size:12px;color:var(--mute);margin-bottom:3px}
.stats .v{font-family:var(--serif);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats .avg .v{font-size:clamp(22px,4dvh,30px);color:var(--inc)}
.stats .avg .v.neg{color:var(--seal)}
.stats .oth .v.inc{color:var(--inc)}
.hsub{font-size:13px;color:var(--mute);margin-top:6px;font-variant-numeric:tabular-nums}
.hsub b{color:var(--inc);font-weight:700}
.statsub{font-size:12px;color:var(--mute);margin-top:6px}
.stats .oth .v{font-size:clamp(16px,2.6dvh,19px)}

.budget{margin-top:clamp(8px,1.6dvh,14px)}
.budget .bt{font-size:12.5px;color:var(--mute);margin-bottom:5px;display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.budget .bb{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.budget .bb i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .5s}
.budget.over .bb i{background:var(--seal)}
.budget.over .bt{color:var(--seal)}

.chart{display:flex;align-items:flex-end;gap:8px;height:clamp(50px,9dvh,86px);margin-top:clamp(8px,2dvh,18px)}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:5px}
.chart .bar{width:100%;border-radius:4px 4px 1px 1px;background:var(--ink);opacity:.22;min-height:3px;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.chart .col.today .bar{background:var(--seal);opacity:1}
.chart .d{font-size:11px;color:var(--mute);line-height:1}
.chart .col.today .d{color:var(--seal);font-weight:700}

.recent{flex:1;min-height:0;overflow:hidden;margin-top:clamp(6px,1.6dvh,14px);display:flex;flex-direction:column}
.recent .empty{margin:auto 0;text-align:center;color:var(--mute);font-size:14px;line-height:1.7;padding:0 12px}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.ico{width:38px;height:38px;border-radius:11px;background:var(--card);display:grid;place-items:center;font-size:19px;flex:none;border:1px solid var(--line)}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid em{display:block;font-style:normal;font-size:12px;color:var(--mute);margin-top:2px}
.row .amt{font-family:var(--serif);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .amt.inc{color:var(--inc)}
.row .mk{font-size:12px;opacity:.75}

.bar-bottom{display:flex;gap:8px;padding-top:10px}
.ghost{flex:0 0 58px;height:58px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14.5px}
.sealbtn{flex:1;height:58px;border-radius:16px;background:var(--seal);color:var(--on-seal);font-size:18px;font-weight:700;letter-spacing:2px;font-family:var(--serif);box-shadow:inset 0 0 0 3px var(--seal),inset 0 0 0 4.5px color-mix(in srgb,var(--on-seal) 55%,transparent);transition:transform .12s}
.sealbtn:active{transform:scale(.97)}

/* ---------- 面板 ---------- */
.bd{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 55%,transparent);opacity:0;pointer-events:none;transition:opacity .25s;z-index:11}
.bd.show{opacity:1;pointer-events:auto}
#bd2{z-index:19}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;background:var(--paper);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s .34s;z-index:10;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);visibility:hidden}
.sheet.open{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s 0s}
.page{height:100dvh;border-radius:0;padding-top:env(safe-area-inset-top)}
#sheetDetail{height:90dvh;z-index:12}
#sheetAdd{z-index:14}
#sheetCur{z-index:20}
#sheetCats{z-index:13}
#sheetRecur{z-index:13}
.rcempty{text-align:center;color:var(--mute);font-size:14px;line-height:1.7;padding:48px 12px}
.slot{min-height:26px;display:flex;align-items:center;justify-content:center;margin-top:-4px}
.slot .res{margin:0}
.slot .qn{margin:0;max-width:100%}
.slot .qn button:first-child{margin-left:auto}
.slot .qn button:last-child{margin-right:auto}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 8px;min-height:52px;gap:8px}
.sh-head h2{margin:0;font-family:var(--serif);font-size:18px}
.sh-head .t{font-size:15px;color:var(--mute);padding:6px 0;min-width:60px;text-align:left}
.sh-head .t.r{text-align:right}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 20px 28px;-webkit-overflow-scrolling:touch}

/* 通用小控件 */
.sg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.sg button{flex:1;height:34px;font-size:14px;color:var(--mute)}
.sg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.note,.fld{width:100%;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font:inherit;font-size:16px}
.note::placeholder,.fld::placeholder{color:var(--mute)}
.nw{position:relative}.nw .note{padding-right:52px}
.mic{position:absolute;right:4px;top:3px;width:38px;height:36px;border-radius:10px;font-size:19px;display:grid;place-items:center}
.mic.on{background:var(--seal);animation:micp 1s ease-in-out infinite}
@keyframes micp{50%{opacity:.55}}
select.fld{padding:0 8px;height:40px;min-width:0;appearance:none;-webkit-appearance:none;text-overflow:ellipsis}

/* 币种 */
.curgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:6px 20px 22px}
.curgrid button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;text-align:center}
.curgrid button b{display:block;font-family:var(--serif);font-size:20px}
.curgrid button span{display:block;font-size:11.5px;color:var(--mute);margin-top:3px}
.curgrid button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.curgrid button[aria-pressed="true"] span{color:inherit;opacity:.75}

/* 记一笔 */
#add-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 20px 14px;gap:10px}
#addType{width:150px}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:2px 0;line-height:1.1}
.amount small{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--mute)}
.amount span{font-family:var(--serif);font-weight:700;font-size:clamp(40px,8dvh,58px);font-variant-numeric:tabular-nums}
.amount span.empty{color:var(--line)}
.amount span.inc{color:var(--inc)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:calc(clamp(44px,7dvh,56px)*2 + 8px);overflow-y:auto;align-content:start;scrollbar-width:none;flex:none}
.cats::-webkit-scrollbar{display:none}
.cats button{height:clamp(44px,7dvh,56px);border-radius:13px;background:var(--card);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px}
.cats button i{font-style:normal;font-size:19px;line-height:1.1}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.acts{display:flex;gap:8px}
.chip{flex:1;height:42px;border-radius:12px;border:1.5px dashed var(--mute);display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;color:var(--ink);position:relative;min-width:0;overflow:hidden}
.chip.on{border-style:solid;border-color:var(--ink);background:var(--card)}
.chip .ci{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:16px;background-size:cover;background-position:center;flex:none}
.chip .x{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:28px;height:34px;display:grid;place-items:center;font-size:18px;color:var(--mute)}
.chip input[type=datetime-local]{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0}
.pad{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,minmax(34px,1fr));gap:8px}
.pad button{border-radius:12px;background:var(--card);border:1px solid var(--line);font-family:var(--serif);font-size:24px;font-weight:600}
.pad button:active{background:var(--line)}
.pad .op{color:var(--seal);font-size:26px}
.pad .eq{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pad .eq:active{background:var(--ink);opacity:.8}
.amount.calc{flex-wrap:wrap}
.res{text-align:center;font-size:14px;color:var(--mute);margin-top:-4px;font-variant-numeric:tabular-nums}
.qn{display:flex;gap:6px;overflow-x:auto;flex:none;scrollbar-width:none;margin:-2px 0}
.qn::-webkit-scrollbar{display:none}
.qn button{flex:none;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
.qn button:active{background:var(--line)}
.qn button small{color:var(--mute);margin-left:6px;font-size:12px;font-variant-numeric:tabular-nums}
.acts.four .chip{gap:4px;font-size:13px}
.acts.four .chip .ci{width:22px;height:22px;font-size:14px}
.budget .bt b{font-weight:600;color:var(--ink)}
.budget.over .bt b{color:var(--seal)}
.rcrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rcrow .ico{width:38px;height:38px;border-radius:11px;background:var(--card);display:grid;place-items:center;font-size:20px;flex:none}
.rcrow .mid{flex:1;min-width:0}
.rcrow .mid b{display:block;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcrow .mid em{display:block;font-style:normal;font-size:12px;color:var(--mute);margin-top:2px}
.rcrow .rb{height:34px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);font-size:13px;flex:none}
.rcrow.off .mid,.rcrow.off .ico{opacity:.45}
#sheetAdd.typing .pad{display:none}
.stampbtn{height:56px;border-radius:16px;background:var(--seal);color:var(--on-seal);font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:3px;box-shadow:inset 0 0 0 3px var(--seal),inset 0 0 0 4.5px color-mix(in srgb,var(--on-seal) 55%,transparent);flex:none;transition:opacity .2s,transform .12s}
.stampbtn:active{transform:scale(.98)}
.stampbtn:disabled{opacity:.35}

/* 账本 */
.lf{padding:0 20px 6px;display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;gap:8px}
.lrow>*{flex:1;min-width:0}
.lsum{font-size:12.5px;color:var(--mute);padding:2px 2px 0}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 4px;font-size:12.5px;color:var(--mute);gap:10px}
.dayhead b{font-family:var(--serif);font-size:15px;color:var(--ink);white-space:nowrap}
.dayhead span{text-align:right}
.more{display:block;margin:16px auto 0;padding:10px 22px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;color:var(--mute)}
.blank{text-align:center;color:var(--mute);padding:56px 0;line-height:1.7;font-size:14.5px}

/* 详情 */
.d-amt{text-align:center;padding:6px 0 14px}
.d-amt .num{font-family:var(--serif);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
.d-amt .num.inc{color:var(--inc)}
.d-amt p{margin:6px 0 0;color:var(--mute);font-size:14px}
.d-img{width:100%;max-height:38dvh;object-fit:cover;border-radius:16px;display:block;margin-bottom:12px;border:1px solid var(--line)}
.d-map{width:100%;height:210px;border:0;border-radius:16px;display:block;background:var(--card)}
.d-link{display:block;text-align:center;margin:10px 0 0;color:var(--ink);font-weight:600;font-size:14px}
.d-coord{font-size:12px;color:var(--mute);text-align:center;margin-top:4px}
.d-note{font-size:16px;text-align:center;margin:0 0 14px}
.d-acts{display:flex;gap:10px;margin-top:24px}
.btn{flex:1;height:46px;border-radius:13px;border:1.5px solid var(--ink);font-weight:600;font-size:15px}
.btn.fill{background:var(--ink);color:var(--paper)}
.btn.danger{border-color:var(--seal);color:var(--seal)}

/* 统计 */
.s-nav{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px}
.s-nav button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);font-size:18px;display:grid;place-items:center}
.s-nav button:disabled{opacity:.3}
.s-nav b{font-family:var(--serif);font-size:16px}
.s-hero{padding:14px 0 4px}
.s-hero .k{font-size:13px;color:var(--mute)}
.s-hero .v{font-family:var(--serif);font-weight:700;font-size:48px;line-height:1.1;color:var(--seal);font-variant-numeric:tabular-nums;margin-top:2px;word-break:break-all}
.s-hero .cmp{font-size:13.5px;margin-top:4px;color:var(--mute)}
.s3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 0;border-top:1px solid var(--line);margin-top:12px}
.s3+.s3{margin-top:0;padding-top:0;border-top:0}
.s3 .k{font-size:12px;color:var(--mute);margin-bottom:3px}
.s3 .v{font-family:var(--serif);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;word-break:break-all}
.s3 .v.inc{color:var(--inc)}
.s3 .v.neg{color:var(--seal)}
.s3 .sub{font-size:11.5px;color:var(--mute);margin-top:2px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px;gap:12px}
.sec h3{margin:0;font-family:var(--serif);font-size:16px}
.sec .sg{width:112px}
.plot{position:relative;height:150px}
.bars{position:absolute;inset:0;display:flex;gap:2px;align-items:stretch}
.bars .c{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.bars .b{width:100%;max-width:26px;background:var(--ink);opacity:.28;border-radius:3px 3px 0 0}
.bars .b.z{height:2px;opacity:.15}
.bars .c.today .b{background:var(--seal);opacity:1}
.bars .l{height:18px;font-size:10.5px;color:var(--mute);line-height:18px;white-space:nowrap}
.bars .c.today .l{color:var(--seal);font-weight:700}
.avgline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--seal);opacity:.8;pointer-events:none}
.legend{font-size:12px;color:var(--mute);margin-top:6px}
.donut{width:140px;height:140px;border-radius:50%;margin:4px auto 14px;position:relative}
.donut::after{content:"";position:absolute;inset:28px;border-radius:50%;background:var(--paper)}
.donut .dc{position:absolute;inset:0;display:grid;place-items:center;z-index:1;text-align:center;font-size:12px;color:var(--mute);line-height:1.4}
.donut .dc b{display:block;font-family:var(--serif);font-size:15px;color:var(--ink)}
.crow{display:flex;align-items:center;gap:10px;padding:8px 0}
.crow .dot{width:10px;height:10px;border-radius:3px;flex:none}
.crow .ce{font-size:18px;width:24px;text-align:center;flex:none}
.crow .cm{flex:1;min-width:0}
.crow .cn{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.crow .cn span{color:var(--mute);font-size:12.5px}
.crow .cbar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.crow .cbar i{display:block;height:100%;border-radius:3px}
.crow .ca{font-family:var(--serif);font-weight:700;font-size:15px;min-width:76px;text-align:right;font-variant-numeric:tabular-nums}

/* 设置 */
.grp{margin:18px 0 8px;font-family:var(--serif);font-size:16px;font-weight:700}
.setrow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 0;border-bottom:1px solid var(--line);font-size:15.5px;text-align:left;gap:12px}
.setrow span{color:var(--mute);font-size:13.5px}
.setrow.danger{color:var(--seal)}
.bg-in{display:flex;gap:8px;margin-top:8px}
.bg-in .fld{flex:1}
.bg-in .btn{flex:0 0 78px;height:42px}
.hint{font-size:12.5px;color:var(--mute);line-height:1.6;margin:8px 0 0}

/* 盖章动画 */
#stamp{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ink) 55%,transparent)}
#stamp.show{display:flex}
.stampbox{background:var(--paper);border-radius:22px;padding:30px 34px 24px;text-align:center;min-width:250px}
.seal{width:116px;height:116px;margin:0 auto;border-radius:18px;border:5px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-family:var(--serif);font-size:46px;font-weight:900;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 6px var(--seal);transform:rotate(-7deg);position:relative;animation:drop .5s cubic-bezier(.3,1.4,.5,1) both}
.seal::after{content:"";position:absolute;inset:-6px;border-radius:22px;border:3px solid var(--seal);opacity:0;animation:ripple .7s .28s ease-out}
.stampbox .sa{font-family:var(--serif);font-size:26px;font-weight:700;margin-top:20px;animation:fade .4s .35s both}
.stampbox .sn{font-size:13.5px;color:var(--mute);margin-top:6px;animation:fade .4s .45s both}
@keyframes drop{0%{transform:rotate(-14deg) scale(2.3);opacity:0}55%{opacity:1}70%{transform:rotate(-7deg) scale(.92)}100%{transform:rotate(-7deg) scale(1)}}

#toast{position:fixed;box-shadow:0 6px 20px rgba(0,0,0,.18);left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translate(-50%,10px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:84vw;text-align:center}

/* ---------- 自制对话框 ---------- */
#dlg,#catEd{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:color-mix(in srgb,var(--ink) 55%,transparent);opacity:0;pointer-events:none;transition:opacity .2s}

#dlg.show .dlgbox,#catEd.show .dlgbox{transform:none}
.dlgbox .dl-ico{width:58px;height:58px;margin:0 auto 12px;border-radius:16px;border:3px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-size:26px;font-family:var(--serif);font-weight:900;transform:rotate(-6deg);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4.5px var(--seal)}
.dlgbox h3{margin:0;font-family:var(--serif);font-size:19px}

/* ---------- 自制下拉选择 ---------- */
.pick{width:100%;height:40px;min-width:0;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:left}

#bd3{z-index:29}
.opts{overflow-y:auto;padding:2px 20px 22px;-webkit-overflow-scrolling:touch}
.opts .gl{font-size:12px;color:var(--mute);margin:14px 0 4px}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);font-size:15.5px;text-align:left;gap:10px}
.opt[aria-pressed="true"]{font-weight:700;color:var(--seal)}
.opt[aria-pressed="true"]::after{content:"✓";font-weight:900}

/* ---------- 主题选择 ---------- */
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.tcard{border:1.5px solid var(--line);border-radius:14px;padding:8px 6px 9px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px}
.tcard .sw{width:100%;height:38px;border-radius:9px;display:flex;align-items:flex-end;justify-content:flex-end;padding:5px;border:1px solid rgba(128,128,128,.25)}
.tcard .sw i{width:15px;height:15px;border-radius:50%;display:block}
.tcard[aria-pressed="true"]{border-color:var(--seal);box-shadow:0 0 0 1.5px var(--seal);font-weight:700}

/* 左滑操作 */
.sw{position:relative;overflow:hidden;border-top:1px solid var(--line);width:100%}
.sw:first-child{border-top:0}
.sw .row{border-top:0;background:var(--paper);position:relative;touch-action:pan-y;transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.sw.open .row{transform:translateX(-144px)}
.sw.drag .row{transition:none}
.sw-act{position:absolute;top:0;right:0;bottom:0;width:144px;display:flex;visibility:hidden;transition:visibility 0s .24s}
.sw.open .sw-act,.sw.drag .sw-act{visibility:visible;transition:none}
.sw-act button{flex:1;font-size:14.5px;font-weight:600;background:var(--ink);color:var(--paper)}
.sw-act button[data-act="del"]{background:var(--seal);color:var(--on-seal)}
/* 带操作的提示条 */
#toast{display:flex;align-items:center;gap:14px}
#toast.act{pointer-events:auto}
#toast button{font-weight:700;text-decoration:underline;white-space:nowrap;padding:2px 0}

/* 日历 */
.cal-nav{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;margin:10px 0 4px}
.cal-nav .pill{border:1.5px solid var(--ink);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px;justify-self:start}

.dlgbox.ed .dl-acts .btn{flex:1;height:42px;font-size:14.5px}

/* 账户 */

.accrow button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lrow .pick{font-size:14px;padding:0 8px}
.aTotal{margin:8px 0 4px;padding:16px 4px 14px;border-bottom:1px solid var(--line)}
.aTotal .k{font-size:13px;color:var(--mute)}
.aTotal .v{font-family:var(--serif);font-weight:700;font-size:40px;line-height:1.15;font-variant-numeric:tabular-nums;word-break:break-all}
.aTotal .v.neg{color:var(--seal)}
.acrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.acrow .mid{flex:1;min-width:0}
.acrow .mid b{display:block;font-size:15.5px;font-weight:600}
.acrow .mid em{display:block;font-style:normal;font-size:12px;color:var(--mute);margin-top:2px}
.acrow .bal{text-align:right;font-family:var(--serif);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.acrow .bal.neg{color:var(--seal)}
.acrow .bal small{display:block;font-size:11.5px;font-weight:400;color:var(--mute);margin-top:2px}
#accEd{position:fixed;inset:0;z-index:62;display:grid;place-items:center;padding:24px;background:color-mix(in srgb,var(--ink) 55%,transparent);opacity:0;pointer-events:none;transition:opacity .2s}
#accEd.show{opacity:1;pointer-events:auto}
#accEd.show .dlgbox{transform:none}
.ac-lab{font-size:12.5px;color:var(--mute);margin:14px 0 6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

/* IndexedDB：容量大，照片不再受 5MB 限制；不可用时退回 localStorage */
const DB={ok:false,db:null,
  open(){return new Promise(res=>{
    if(!window.indexedDB)return res(false);
    try{
      const r=indexedDB.open('ledger-db',1);
      r.onupgradeneeded=()=>{r.result.createObjectStore('entries',{keyPath:'id'})};
      r.onsuccess=()=>{this.db=r.result;this.ok=true;res(true)};
      r.onerror=r.onblocked=()=>res(false);
    }catch(e){res(false)}
  })},
  tx(mode,fn){return new Promise((res,rej)=>{
    const t=this.db.transaction('entries',mode),out=fn(t.objectStore('entries'));
    t.oncomplete=()=>res(out&&out.result);t.onerror=t.onabort=()=>rej(t.error);
  })},
  all(){return this.tx('readonly',st=>st.getAll())},
  put(list){return this.tx('readwrite',st=>{list.forEach(e=>st.put(e))})},
  del(id){return this.tx('readwrite',st=>{st.delete(id)})},
  clear(){return this.tx('readwrite',st=>{st.clear()})}
};
async function persist(arg){
  const list=Array.isArray(arg)?arg:arg?[arg]:entries,e=Array.isArray(arg)?null:arg;
  syncMark(list.map(x=>x.id),'u');
  if(DB.ok){
    try{await DB.put(list);return true}catch(err){
      if(e&&e.photo){e.photo=null;try{await DB.put([e]);toast('存储空间不足，这一笔已记下，但照片没能保存');return true}catch(_){}}
      toast('无法写入存储：关闭页面后数据可能丢失，请先导出备份');return false;
    }
  }
  if(store.set('ledger.entries',entries))return true;
  if(e&&e.photo){e.photo=null;if(store.set('ledger.entries',entries)){toast('存储空间不足，这一笔已记下，但照片没能保存');return true}}
  toast('无法写入本地存储：关闭页面后数据可能丢失，请先导出备份');return false;
}
async function unstore(id){

  if(DB.ok){try{await DB.del(id)}catch(err){toast('删除没能写入存储，请稍后重试')}}
  else store.set('ledger.entries',entries);
}

    }
    st.cur=Math.max(-W-16,Math.min(0,st.base+dx));

  });
  const end=e=>{
    if(!st||e.pointerId!==st.id)return;
    const s0=st;st=null;if(!s0.drag)return;
    s0.w.classList.remove('drag');s0.row.style.transform='';

/* ---------- 首页 ---------- */
function range(){
  const now=new Date();
  if(period==='month')return{start:new Date(now.getFullYear(),now.getMonth(),1),days:now.getDate()};
  if(period==='7d'){const s=startOfDay(now);s.setDate(s.getDate()-6);return{start:s,days:7}}
  const mine=entries.filter(e=>e.cur===cur);
  if(!mine.length)return{start:startOfDay(now),days:1};
  const first=Math.min(...mine.map(e=>e.ts));
  return{start:startOfDay(first),days:daysBetween(first,now)+1};
}
function streak(){
  const set=new Set(entries.map(e=>dk(e.ts)));
  let d=startOfDay(new Date()),n=0;
  if(!set.has(dk(d)))d.setDate(d.getDate()-1);
  while(set.has(dk(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}
function rowHTML(e,withDate,swipe){
  const c=catOf(e),t=new Date(e.ts);
  const when=(withDate?`${t.getMonth()+1}月${t.getDate()}日 `:'')+`${pad2(t.getHours())}:${pad2(t.getMinutes())}`;
  const marks=(e.rid?'🔁':'')+(e.photo?'📷':'')+(e.loc?'📍':'');
  const inner=`<button class="row" data-id="${e.id}"><span class="ico">${c[1]}</span>
    <span class="mid"><b>${esc(e.note||c[2])}</b><em>${when}　${c[2]}${accOf(e)?' · '+esc(accOf(e).name):''}</em></span>
    <span class="mk">${marks}</span><span class="amt${isInc(e)?' inc':''}">${isInc(e)?'+':''}${fmt(e.amt,e.cur)}</span></button>`;
  return swipe?`<div class="sw" data-id="${e.id}"><div class="sw-act"><button data-act="edit">编辑</button><button data-act="del">删除</button></div>${inner}</div>`:inner;
}

  const days=[];

  const recent=[...entries].sort((a,b)=>b.ts-a.ts).slice(0,3);
  $('#recent').innerHTML=recent.length?recent.map(e=>rowHTML(e,false,true)).join(''):(loaded?'<div class="empty">还没有账目。<br>点下面的「记一笔」，盖下第一枚章。</div>':'');
}

function newDraft(){return{id:null,type:'exp',amt:'',cat:suggestCat('exp'),acc:defAcc(),photo:null,loc:null,ts:null,cur}}
/* 金额算式：12+8.5−3 */
function evalAmt(expr,c){
  const f=Math.pow(10,curOf(c||draft.cur).d),t=String(expr||'').replace(/[+−]+$/,'');
  if(!t)return NaN;
  let tot=0,sign=1;
  t.split(/([+−])/).forEach(tok=>{if(tok==='+')sign=1;else if(tok==='−')sign=-1;else tot+=sign*(parseFloat(tok)||0)});
  return Math.round(tot*f)/f;
}
const hasOp=a=>/[+−]/.test(a);
function pushDigit(a,ch,d){
  const i=Math.max(a.lastIndexOf('+'),a.lastIndexOf('−'));
  if(a.slice(i+1)==='0')a=a.slice(0,i+1);
  const seg=a.slice(i+1);
  if(a.length>=30||seg.replace('.','').length>=10)return a;
  const dot=seg.indexOf('.');if(dot>=0&&seg.length-dot-1>=d)return a;
  return a+ch;
}
/* 智能默认分类：最近常用的，并偏向同一时段 */
function suggestCat(type){
  const list=listOf(type),h=new Date().getHours(),sc={};
  entries.filter(e=>isInc(e)===(type==='inc')).sort((a,b)=>b.ts-a.ts).slice(0,150).forEach(e=>{
    if(!list.some(c=>c[0]===e.cat))return;
    const dh=Math.abs(new Date(e.ts).getHours()-h),near=Math.min(dh,24-dh)<=2;
    sc[e.cat]=(sc[e.cat]||0)+(near?2:1);
  });
  const best=Object.keys(sc).sort((a,b)=>sc[b]-sc[a])[0];
  return best||list[0][0];
}
/* 备注快捷词：这个分类下最常用的几条，并带上它最常用的金额 */
function renderQN(){
  const m=new Map(),isI=draft.type==='inc';
  entries.forEach(e=>{
    if(isInc(e)!==isI||e.cat!==draft.cat||!e.note)return;
    const o=m.get(e.note)||{n:0,t:0,a:new Map()};o.n++;o.t=Math.max(o.t,e.ts);
    if(e.cur===draft.cur)o.a.set(e.amt,(o.a.get(e.amt)||0)+1);
    m.set(e.note,o);
  });
  const typed=$('#note').value.trim();
  const list=[...m.entries()].filter(([k])=>k!==typed).sort((a,b)=>b[1].n-a[1].n||b[1].t-a[1].t).slice(0,5)
    .map(([k,o])=>[k,[...o.a.entries()].sort((a,b)=>b[1]-a[1]||b[0]-a[0])[0]]);
  const el=$('#qn');el.hidden=!list.length;
  el.innerHTML=list.map(([k,a])=>`<button type="button" data-n="${esc(k)}"${a?` data-a="${a[0]}"`:''}>${esc(k)}${a?`<small>${fmtNum(a[0],draft.cur)}</small>`:''}</button>`).join('');
  $$('#qn button').forEach(b=>b.onclick=()=>{
    $('#note').value=b.dataset.n;
    if(!draft.amt&&b.dataset.a&&!draft.id)draft.amt=b.dataset.a;   // 金额还没填时，顺手带出常用金额
    renderQN();renderAdd();buzz(8);
  });
}
/* 常用金额：这个分类 + 这个币种下最常记的几个，一点就填 */
function renderQA(){
  const el=$('#qa');
  if(draft.amt||draft.id){el.hidden=true;return}
  const cnt=new Map(),isI=draft.type==='inc';
  entries.forEach(e=>{
    if(isInc(e)!==isI||e.cat!==draft.cat||e.cur!==draft.cur)return;
    const o=cnt.get(e.amt)||{n:0,t:0};o.n++;o.t=Math.max(o.t,e.ts);cnt.set(e.amt,o);
  });
  const list=[...cnt.entries()].sort((a,b)=>b[1].n-a[1].n||b[1].t-a[1].t).slice(0,4).map(x=>x[0]);
  el.hidden=!list.length;
  el.innerHTML=list.map(a=>`<button type="button" data-a="${a}">${fmtNum(a,draft.cur)}</button>`).join('');
  $$('#qa button').forEach(b=>b.onclick=()=>{draft.amt=b.dataset.a;renderAdd();buzz(8)});
}
/* 备注 → 分类：写下“咖啡”，就按以往的记法自动选好分类（手动选过分类后不再自动改） */
function autoCat(){
  if(draft.id||draft.catManual)return;
  const q=$('#note').value.trim().toLowerCase();if(!q)return;
  const isI=draft.type==='inc',sc={};
  entries.forEach(e=>{
    if(isInc(e)!==isI||!e.note)return;
    const n=e.note.toLowerCase();
    if(n===q)sc[e.cat]=(sc[e.cat]||0)+3;else if(q.length>=2&&n.startsWith(q))sc[e.cat]=(sc[e.cat]||0)+1;
  });
  const best=Object.keys(sc).sort((a,b)=>sc[b]-sc[a])[0];
  if(best&&sc[best]>=2&&best!==draft.cat&&listOf(draft.type).some(c=>c[0]===best)){
    draft.cat=best;renderAdd();showCat();renderQN();buzz(6);
  }
}

function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const M=720,r=Math.min(1,M/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.62));
    };
    img.onerror=rej;img.src=url;
  });
}

/* ---------- 周期账目 ---------- */
const FREQ_L={week:'每周',month:'每月',year:'每年'};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const parseDK=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
function freqText(r){
  return r.freq==='week'?`每周${WD[r.wd]}`:r.freq==='month'?`每月 ${r.day} 号`:`每年 ${r.month+1} 月 ${r.day} 日`;
}
/* 在 [fromD, toD]（含）内，这条规则该发生的所有日期；月底不足时顺延到当月最后一天 */
function occDates(r,fromD,toD){
  const out=[];
  if(r.freq==='week'){
    const d=new Date(fromD);while(d.getDay()!==r.wd&&d<=toD)d.setDate(d.getDate()+1);
    for(;d<=toD;d.setDate(d.getDate()+7))out.push(new Date(d));
  }else if(r.freq==='month'){
    let y=fromD.getFullYear(),m=fromD.getMonth();
    while(new Date(y,m,1)<=toD){
      const dim=new Date(y,m+1,0).getDate(),d=new Date(y,m,Math.min(r.day,dim));
      if(d>=fromD&&d<=toD)out.push(d);
      if(++m>11){m=0;y++}
    }
  }else{
    for(let y=fromD.getFullYear();y<=toD.getFullYear();y++){
      const dim=new Date(y,r.month+1,0).getDate(),d=new Date(y,r.month,Math.min(r.day,dim));
      if(d>=fromD&&d<=toD)out.push(d);
    }
  }
  return out;
}
/* 把到期的周期账目补记成真正的账目（幂等：同一规则同一天只会记一次） */
function runRecurs(){
  if(!loaded||!recurs.length)return 0;
  const today=startOfDay(new Date()),made=[];
  const have=new Set(entries.filter(e=>e.rid).map(e=>e.rid+'|'+e.occ));
  recurs.forEach(r=>{
    if(r.off)return;
    const from=parseDK(r.last);from.setDate(from.getDate()+1);
    if(from>today)return;
    occDates(r,from,today).slice(-36).forEach(d=>{
      const occ=dk(d);if(have.has(r.id+'|'+occ))return;
      const ts=Math.min(new Date(d.getFullYear(),d.getMonth(),d.getDate(),9,0).getTime(),Date.now());
      made.push({id:newId(),ts,type:r.type,amt:r.amt,cur:r.cur,cat:r.cat,acc:accById(r.acc)?r.acc:null,note:r.note,photo:null,loc:null,rid:r.id,occ});
    });
    r.last=dk(today);
  });
  saveRecurs();
  if(made.length){entries=entries.concat(made);persist(made);refreshAll();toast(`已按周期自动记了 ${made.length} 笔`)}
  return made.length;
}
function renderRecur(){
  const el=$('#recurBody');
  if(!recurs.length){
    el.innerHTML='<div class="rcempty">还没有周期账目。<br>记一笔时点「🔁 重复」，<br>房租、订阅、话费就会按时自动入账。</div>';return;
  }
  el.innerHTML=recurs.map((r,i)=>{
    const c=catOf(r);
    return `<div class="rcrow${r.off?' off':''}"><span class="ico">${c[1]}</span>
      <span class="mid"><b>${esc(r.note||c[2])}</b><em>${freqText(r)} · ${isInc(r)?'+':''}${fmt(r.amt,r.cur)}${r.off?' · 已暂停':''}</em></span>
      <button class="rb" data-pause="${i}">${r.off?'恢复':'暂停'}</button><button class="rb" data-del="${i}" style="color:var(--seal)">删除</button></div>`;
  }).join('')+'<p class="hint">到期后，打开应用时会自动记账；已经记下的账目不会因为暂停或删除而消失。</p>';

/* ---------- 语音记账：说“午餐15”→ 备注午餐、金额 15 ---------- */
const VCN={零:0,〇:0,一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
function cn2num(s){
  if(/^\d+(\.\d+)?$/.test(s))return +s;
  const [ip,fp]=s.split('点');
  const intP=t=>{
    if(!t)return 0;if(/^\d+$/.test(t))return +t;
    let total=0,sec=0,n=0;
    for(const ch of t){
      if(ch in VCN)n=VCN[ch];
      else if(ch==='十'){sec+=(n||1)*10;n=0}
      else if(ch==='百'){sec+=n*100;n=0}
      else if(ch==='千'){sec+=n*1000;n=0}
      else if(ch==='万'){total+=(sec+n||1)*10000;sec=0;n=0}
    }
    let v=total+sec+n;
    const m=t.match(/([百千])([一二两三四五六七八九])$/);       // “一百五”= 150、“两千五”= 2500
    if(m)v+=VCN[m[2]]*(m[1]==='百'?9:99);
    return v;
  };
  let v=intP(ip);
  if(fp){let k=0.1;for(const ch of fp){v+=(/\d/.test(ch)?+ch:VCN[ch]||0)*k;k/=10}}
  return v;
}
const V_KW={
  exp:[['food',/饭|餐|吃|咖啡|茶|饮|早点|宵夜|零食|外卖|面|粉|菜|果|肉|鸡|鱼|饼|包子|奶|酒|烧烤|午|晚/],['move',/车|地铁|公交|油|停车|高速|过路|机票|火车|滴滴|grab|充电|渡轮/],['health',/药|医|病|挂号|牙|体检/],['study',/书|课|学费|培训|文具|考试/],['home',/租|水电|电费|水费|网费|话费|煤气|物业|维修/],['fun',/电影|游戏|唱歌|旅|玩|演出|会员|门票/],['shop',/买|衣|鞋|包|淘宝|购物|化妆|日用|超市/]],
  inc:[['bonus',/奖金/],['salary',/工资|薪/],['redpk',/红包/],['side',/兼职/],['refund',/退款|退/],['invest',/理财|利息|分红|股/]]
};
function parseVoice(raw){
  let t=String(raw).replace(/\s+/g,'').replace(/[，。！？、,!?]/g,'');
  let back=0;if(/前天/.test(t)){back=2;t=t.replace('前天','')}else if(/昨天|昨日/.test(t)){back=1;t=t.replace(/昨天|昨日/,'')}
  t=t.replace(/今天|今日/,'');
  const inc=/收入|工资|薪水|薪资|奖金|赚|进账|收到|到账|红包|兼职|退款|利息|分红/.test(t);
  const NUM='(?:\\d+(?:\\.\\d+)?|[零〇一二两三四五六七八九十百千万]+(?:点[零〇一二三四五六七八九\\d]+)?)';
  const re=new RegExp('(rm)?('+NUM+')(?:(块钱|块|元)(?:([一二两三四五六七八九\\d])(?:毛|角)?)?|(令吉|林吉特|马币|ringgit))?','gi');
  const c=[];let m;
  while((m=re.exec(t))){
    const unit=!!(m[1]||m[3]||m[5]),arabic=/^\d/.test(m[2]);
    if(!unit&&!arabic&&m[2].length<2)continue;           // 单个汉字数字（如“一杯”）当作普通文字
    let v=cn2num(m[2]);if(m[4])v+=cn2num(m[4])/10;
    if(v>0)c.push({v,unit,i:m.index,len:m[0].length});
  }
  if(!c.length)return {amt:0};
  const pool=c.filter(x=>x.unit),pick=(pool.length?pool:c).slice(-1)[0];
  let note=t.slice(0,pick.i)+t.slice(pick.i+pick.len);
  note=note.replace(/收入|赚了|赚|收到了|收到|进账|到账|支出|记一笔|记账/g,'')
    .replace(/^(我|刚才|刚刚|花了|花|用了|付了|共计|一共|总共|大概|大约|买了)+/,'').replace(/(了|的|左右|钱|共)+$/,'');
  return {amt:pick.v,note:note.trim(),inc,back};
}
function guessVoiceCat(note,type){
  for(const [id,re] of V_KW[type==='inc'?'inc':'exp'])if(re.test(note)&&listOf(type).some(c=>c[0]===id))return id;
  return null;
}
function applyVoice(raw){
  const r=parseVoice(raw);
  if(!(r.amt>0)){toast('听到“'+raw+'”，但没听出金额，再说一次试试');return}
  if(r.inc&&draft.type!=='inc'){draft.type='inc';draft.cat=suggestCat('inc');draft.catManual=false}
  draft.amt=String(+r.amt.toFixed(curOf(draft.cur).d));
  if(r.note)$('#note').value=r.note.slice(0,40);
  if(r.back){const d=new Date();d.setDate(d.getDate()-r.back);draft.ts=d.getTime()}
  if(!draft.id&&!draft.catManual){const k=guessVoiceCat(r.note||'',draft.type);if(k)draft.cat=k}
  renderCats();renderAdd();autoCat();showCat();buzz(12);
  toast(`已识别：${r.note||'无备注'} · ${fmt(+draft.amt,draft.cur)}，确认后点盖章`);
}
(function(){

function filtered(){

    if(lf.type!=='all'&&(isInc(e)?'inc':'exp')!==lf.type)return false;
    if(lf.month!=='all'&&monthKey(e.ts)!==lf.month)return false;
    if(lf.cat!=='all'&&e.cat!==lf.cat)return false;
    if(lf.cur!=='all'&&e.cur!==lf.cur)return false;

    return true;

function sumsText(list){

/* ---------- 统计 ---------- */
function rangeFor(mode,off){
  const now=new Date(),t0=startOfDay(now);
  let start,endEx,label;
  if(mode==='week'){
    start=new Date(t0);start.setDate(start.getDate()-((t0.getDay()+6)%7)+off*7);
    endEx=new Date(start);endEx.setDate(endEx.getDate()+7);
    const last=new Date(endEx);last.setDate(last.getDate()-1);
    label=`${start.getMonth()+1}月${start.getDate()}日 – ${last.getMonth()+1}月${last.getDate()}日`;
  }else if(mode==='month'){
    start=new Date(now.getFullYear(),now.getMonth()+off,1);
    endEx=new Date(start.getFullYear(),start.getMonth()+1,1);
    label=`${start.getFullYear()}年${start.getMonth()+1}月`;
  }else{
    start=new Date(now.getFullYear()+off,0,1);endEx=new Date(start.getFullYear()+1,0,1);
    label=`${start.getFullYear()}年`;
  }
  const days=daysBetween(start,endEx);
  const elapsed=Math.max(1,Math.min(days,daysBetween(start,now)+1));
  return{start,endEx,label,days,elapsed};
}
function renderStats(){
  const body=$('#statsBody'),top=body.scrollTop;
  $('#stCur').textContent=curTag(cur)+' ▾';
  const now=new Date(),mode=sp.mode;
  const R=rangeFor(mode,sp.off),P=rangeFor(mode,sp.off-1);
  const inRange=(e,r)=>e.cur===cur&&e.ts>=r.start.getTime()&&e.ts<r.endEx.getTime();
  const inR=entries.filter(e=>inRange(e,R));
  const exps=inR.filter(e=>!isInc(e)),incs=inR.filter(isInc);
  const sumE=sum(exps),sumI=sum(incs),bal=sumI-sumE;
  const avg=sumE/R.elapsed;
  const prevSum=sum(entries.filter(e=>!isInc(e)&&inRange(e,P)));
  const pn={week:'上周',month:'上月',year:'去年'}[mode];
  let cmp;
  if(prevSum>0){
    const pct=Math.round((avg-prevSum/P.days)/(prevSum/P.days)*100);
    cmp=pct===0?`与${pn}的日均持平`:`比${pn}的日均${pct>0?'多':'少'}了 ${Math.abs(pct)}%`;
  }else cmp=`${pn}没有支出记录可对比`;

  // 单日最高、单笔最高
  const dayMap={};exps.forEach(e=>{const k=dk(e.ts);dayMap[k]=(dayMap[k]||0)+e.amt});
  let mdK=null,md=0;for(const k in dayMap)if(dayMap[k]>md){md=dayMap[k];mdK=k}
  const big=[...exps].sort((a,b)=>b.amt-a.amt)[0];

  // 趋势柱状图
  const nb=mode==='year'?12:R.days,sums=new Array(nb).fill(0);
  exps.forEach(e=>{const i=mode==='year'?new Date(e.ts).getMonth():daysBetween(R.start,e.ts);if(i>=0&&i<nb)sums[i]+=e.amt});
  const elB=mode==='year'?(sp.off===0?now.getMonth()+1:12):R.elapsed;
  const avgB=sumE/elB,mx=Math.max(...sums,avgB,1);
  const todayI=sp.off!==0?-1:mode==='year'?now.getMonth():R.elapsed-1;
  const cols=sums.map((v,i)=>{
    const d=new Date(R.start);d.setDate(d.getDate()+i);

  }).join('');

  // 分类构成
  const list=listOf(sp.type),src=sp.type==='inc'?incs:exps,tot=sum(src);
  const byc=list.map((c,i)=>({c,i,v:sum(src.filter(e=>e.cat===c[0]))})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  let donut='',rows='';

    donut=`<div class="donut" style="background:conic-gradient(${stops})"><div class="dc"><div>${sp.type==='inc'?'收入':'支出'}<b>${fmt(tot,cur)}</b></div></div></div>`;
    rows=byc.map(x=>{const p=x.v/tot*100;return `<div class="crow"><span class="dot" style="background:${COL[x.i%COL.length]}"></span><span class="ce">${x.c[1]}</span><div class="cm"><div class="cn"><b style="font-weight:600">${x.c[2]}</b><span>${p<1?'<1':Math.round(p)}%</span></div><div class="cbar"><i style="width:${p}%;background:${COL[x.i%COL.length]}"></i></div></div><span class="ca">${fmt(x.v,cur)}</span></div>`}).join('');
  }else rows=`<div class="blank" style="padding:28px 0">这段时间没有${sp.type==='inc'?'收入':'支出'}记录</div>`;

  const topList=[...src].sort((a,b)=>b.amt-a.amt).slice(0,5);
  const g=(a,k)=>`<button data-${a}="${k}" aria-pressed="${(a==='sm'?mode:sp.type)===k}">`;

  body.innerHTML=`
    <div class="sg" style="margin-top:8px">${g('sm','week')}周</button>${g('sm','month')}月</button>${g('sm','year')}年</button></div>
    <div class="s-nav"><button data-nav="-1" aria-label="上一段">‹</button><b>${R.label}</b><button data-nav="1" aria-label="下一段" ${sp.off>=0?'disabled':''}>›</button></div>
    <div class="s-hero"><div class="k">平均每天花费</div><div class="v">${fmt(avg,cur)}</div><div class="cmp">${cmp}</div></div>
    <div class="s3">
      <div><div class="k">支出</div><div class="v">${fmt(sumE,cur)}</div></div>
      <div><div class="k">收入</div><div class="v inc">${fmt(sumI,cur)}</div></div>
      <div><div class="k">结余</div><div class="v ${bal<0?'neg':'inc'}">${bal<0?'-':''}${fmt(Math.abs(bal),cur)}</div></div>
    </div>

function accBal(list,c){
  // list: 属于这个账户的账目；返回某币种的余额（收入 − 支出）
  return list.filter(e=>e.cur===c).reduce((t,e)=>t+(isInc(e)?e.amt:-e.amt),0);
}
function renderAcc(){
  const body=$('#accBody'),top=body.scrollTop;
  $('#acCur').textContent=curTag(cur)+' ▾';
  const rows=ACCS.map(a=>({a,list:entries.filter(e=>e.acc===a.id)}));
  const loose=entries.filter(e=>!accOf(e));
  const balOf=(a,list,c)=>(a&&a.init&&a.init[c]||0)+accBal(list,c);
  const totalCur=rows.reduce((t,r)=>t+balOf(r.a,r.list,cur),0)+accBal(loose,cur);
  const money=(v,c)=>(v<0?'-':'')+fmt(Math.abs(v),c);
  const others=(a,list)=>{
    const cs=new Set(list.map(e=>e.cur));if(a&&a.init)Object.keys(a.init).forEach(c=>cs.add(c));
    cs.delete(cur);
    return [...cs].map(c=>[c,balOf(a,list,c)]).filter(x=>Math.abs(x[1])>0.0001).map(x=>money(x[1],x[0])).join(' · ');
  };
  const rowH=(a,list,idx)=>{
    const v=balOf(a,list,cur),o=others(a,list);
    return `<button class="acrow" ${idx!=null?`data-ae="${idx}"`:'data-loose="1"'}><span class="ico">${a?a.icon:'🗂️'}</span><span class="mid"><b>${a?esc(a.name):'未指定账户'}</b><em>${list.length} 笔${a?'':'　点一下可批量归入某个账户'}</em></span><span class="bal${v<0?' neg':''}">${money(v,cur)}${o?`<small>${esc(o)}</small>`:''}</span></button>`;
  };
  body.innerHTML=`
    <div class="aTotal"><div class="k">总资产（${cur}）</div><div class="v${totalCur<0?' neg':''}">${money(totalCur,cur)}</div></div>
    ${rows.map((r,i)=>rowH(r.a,r.list,i)).join('')}
    ${loose.length?rowH(null,loose,null):''}
    <button class="btn fill" id="acAdd" style="width:100%;margin-top:18px">＋ 添加账户</button>
    <p class="hint">余额 = 初始余额 + 收入 − 支出，按币种分开算。点一个账户可改名称、图标和初始余额。切换右上角的货币，可以看其他币种的余额。</p>`;
  body.scrollTop=top;
}

/* 手机上优先走系统分享面板（可直接存到“文件”、iCloud、微信等），不支持时退回普通下载 */
async function deliver(name,text,type){
  try{
    if(navigator.share&&navigator.canShare&&matchMedia('(pointer:coarse)').matches){
      const f=new File([text],name,{type});
      if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return 'shared'}
    }
  }catch(e){if(e&&e.name==='AbortError')return 'cancel'}
  download(name,text,type);return 'saved';
}
function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600);
}
async function exportCSV(){
  if(!entries.length){toast('还没有账目可导出');return}
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['日期','时间','类型','分类','账户','金额','币种','备注','纬度','经度']];
  [...entries].sort((a,b)=>a.ts-b.ts).forEach(e=>{
    const d=new Date(e.ts);
    rows.push([dk(d),pad2(d.getHours())+':'+pad2(d.getMinutes()),isInc(e)?'收入':'支出',catOf(e)[2],accOf(e)?accOf(e).name:'',e.amt,e.cur,e.note||'',e.loc?e.loc.lat:'',e.loc?e.loc.lng:'']);
  });
  const r=await deliver('记账-'+dk(Date.now())+'.csv','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');
  if(r!=='cancel')toast('CSV 已导出');
}
async function exportJSON(){
  const r=await deliver('记账备份-'+dk(Date.now())+'.json',JSON.stringify({app:'ledger',v:4,entries,budgets,recurs,accs:ACCS,cats:{exp:CATS,inc:INCS}}),'application/json');
  if(r==='cancel')return;
  store.set('ledger.lastBackup',Date.now());store.set('ledger.bkSnooze',0);if(isOpen('Set'))renderSet();
  toast('备份已导出');
}
$('#importFile').onchange=async ev=>{
  const f=ev.target.files&&ev.target.files[0];ev.target.value='';if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    const list=Array.isArray(data)?data:data.entries;
    if(!Array.isArray(list))throw 0;
    const ids=new Set(entries.map(e=>e.id));
    const add=list.filter(e=>e&&e.id&&e.ts&&e.amt>0&&!ids.has(e.id));
    entries=entries.concat(add);
    if(data.budgets&&typeof data.budgets==='object'){for(const k in data.budgets)if(!(k in budgets))budgets[k]=data.budgets[k];store.set('ledger.budgets',budgets)}
    if(data.cats&&typeof data.cats==='object'){
      [['exp',CATS],['inc',INCS]].forEach(([t,list])=>{
        const src=data.cats[t];if(!Array.isArray(src))return;
        src.forEach(c=>{
          if(!Array.isArray(c)||c.length<3)return;
          const id=cleanTxt(c[0]);if(!id||list.some(x=>x[0]===id))return;
          const at=pinned(list[list.length-1][0])?list.length-1:list.length;
          list.splice(at,0,[id,cleanTxt(c[1])||'🏷️',cleanTxt(c[2])||'未命名']);
        });
      });
      saveCats();
    }
    if(Array.isArray(data.accs)){
      data.accs.forEach(a=>{
        if(!a||typeof a.id!=='string')return;const id=cleanTxt(a.id);if(!id||accById(id))return;
        const init={};if(a.init&&typeof a.init==='object')for(const c in a.init){const n=+a.init[c];if(isFinite(n)&&n!==0)init[curOf(c).c]=n}
        ACCS.push({id,icon:cleanTxt(a.icon)||'💳',name:cleanTxt(a.name)||'账户',init});
      });
      saveAccs();
    }
    if(Array.isArray(data.recurs)){
      const have=new Set(recurs.map(r=>r.id));
      data.recurs.forEach(r=>{
        if(!r||!r.id||have.has(r.id)||!['week','month','year'].includes(r.freq)||!(r.amt>0)||!/^\d{4}-\d{2}-\d{2}$/.test(r.last||''))return;
        recurs.push({id:cleanTxt(r.id),type:r.type==='inc'?'inc':'exp',amt:+r.amt,cur:curOf(r.cur).c,cat:cleanTxt(r.cat),acc:cleanTxt(r.acc)||null,note:cleanTxt(r.note),freq:r.freq,
          day:Math.min(31,Math.max(1,r.day|0||1)),month:Math.min(11,Math.max(0,r.month|0)),wd:Math.min(6,Math.max(0,r.wd|0)),last:r.last,off:!!r.off});
      });
      saveRecurs();
    }
    persist(add);refreshAll();toast(`已导入 ${add.length} 笔新账目`);runRecurs();
  }catch(err){toast('这个文件不是有效的备份')}
};


/* ---------- 云同步（Supabase）：本地优先，登录后在后台与云端合并 ---------- */
const SB_URL='',SB_KEY='';   // ← 填入 Supabase 的 Project URL 和 anon public key（见部署说明）
const Sync=(()=>{
  const on=!!(SB_URL&&SB_KEY),PAGE=40;
  let auth=store.get('ledger.sb'),busy=false,timer=null,msg='';
  const M=store.get('ledger.syncmeta')||{};
  M.pull=M.pull||'';M.dirty=M.dirty||{};M.kv=M.kv||{};M.kvAt=M.kvAt||{};M.kvInit=!!M.kvInit;
  const save=()=>store.set('ledger.syncmeta',M);
  const stEl=()=>$('#syncSt');
  function setMsg(t){msg=t;const el=stEl();if(el)el.textContent=t}
  function sched(ms){clearTimeout(timer);if(on&&auth)timer=setTimeout(run,ms||2500)}
  function mark(ids,t){if(!on||!auth)return;ids.forEach(id=>{M.dirty[String(id)]=t});save();sched()}
  function markKv(k){if(!on||!auth||Sync.applying)return;M.kv[k]=1;save();sched()}
  async function authReq(path,body){
    const r=await fetch(SB_URL+'/auth/v1/'+path,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.msg||j.error_description||j.message||j.error||('HTTP '+r.status));
    return j;
  }
  function setAuth(j){
    auth={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+Math.max(60,(j.expires_in||3600)-60)*1000,uid:j.user&&j.user.id||(auth&&auth.uid),email:j.user&&j.user.email||(auth&&auth.email)};
    store.set('ledger.sb',auth);
  }
  async function token(){
    if(!auth)throw new Error('未登录');
    if(Date.now()<auth.exp)return auth.access;
    try{setAuth(await authReq('token?grant_type=refresh_token',{refresh_token:auth.refresh}))}
    catch(e){if(navigator.onLine&&/refresh|invalid|expired|not found/i.test(e.message)){auth=null;store.set('ledger.sb',null)}throw e}
    return auth.access;
  }
  async function rest(method,path,body,prefer){
    const t=await token();
    const r=await fetch(SB_URL+'/rest/v1/'+path,{method,headers:{apikey:SB_KEY,Authorization:'Bearer '+t,'Content-Type':'application/json',...(prefer?{Prefer:prefer}:{})},body:body?JSON.stringify(body):undefined});
    const txt=await r.text();
    if(!r.ok){let m=txt;try{m=JSON.parse(txt).message||m}catch(_){}throw new Error(m||('HTTP '+r.status))}
    return txt?JSON.parse(txt):null;
  }
  async function push(){
    for(;;){
      const ids=Object.keys(M.dirty).slice(0,PAGE);
      if(ids.length){
        const rows=[],sent={};
        ids.forEach(id=>{
          sent[id]=M.dirty[id];
          if(M.dirty[id]==='d')rows.push({user_id:auth.uid,id,data:{},deleted:true});
          else{const e=entries.find(x=>String(x.id)===id);if(e)rows.push({user_id:auth.uid,id,data:e,deleted:false})}
        });
        if(rows.length)await rest('POST','ledger_entries?on_conflict=user_id,id',rows,'resolution=merge-duplicates,return=minimal');
        ids.forEach(id=>{if(M.dirty[id]===sent[id])delete M.dirty[id]});save();
        continue;
      }
      break;
    }
    const ks=Object.keys(M.kv);
    if(ks.length){
      const rows=ks.map(k=>({user_id:auth.uid,key:k,data:store.get(k)??null}));
      const out=await rest('POST','ledger_kv?on_conflict=user_id,key&select=key,updated_at',rows,'resolution=merge-duplicates,return=representation');
      (out||[]).forEach(o=>{M.kvAt[o.key]=o.updated_at;delete M.kv[o.key]});save();
    }
  }
  async function pull(){
    let changed=false,since=M.pull;
    for(;;){
      const rows=await rest('GET','ledger_entries?select=id,data,deleted,updated_at&order=updated_at.asc&limit='+PAGE+(since?'&updated_at=gt.'+encodeURIComponent(since):''));
      const put=[];
      for(const r of rows){
        since=r.updated_at;if(M.dirty[r.id])continue;
        const i=entries.findIndex(x=>String(x.id)===r.id);
        if(r.deleted){if(i>=0){const [x]=entries.splice(i,1);changed=true;if(DB.ok)try{await DB.del(x.id)}catch(_){}}}
        else if(r.data&&r.data.id!=null&&r.data.ts&&r.data.amt>0){if(i>=0)entries[i]=r.data;else entries.push(r.data);put.push(r.data);changed=true}
      }
      if(put.length){if(DB.ok)await DB.put(put);else store.set('ledger.entries',entries)}
      M.pull=since;save();
      if(rows.length<PAGE)break;
    }
    const kv=await rest('GET','ledger_kv?select=key,data,updated_at');
    const have=new Set(kv.map(r=>r.key));
    Sync.applying=true;
    try{for(const r of kv){
      if(!SYNC_KV.includes(r.key)||M.kv[r.key]||M.kvAt[r.key]===r.updated_at||r.data==null)continue;
      M.kvAt[r.key]=r.updated_at;applyKv(r.key,r.data);changed=true;
    }}finally{Sync.applying=false}
    if(!M.kvInit){SYNC_KV.forEach(k=>{if(!have.has(k)&&store.get(k)!=null)M.kv[k]=1});M.kvInit=true}
    save();
    return changed;
  }
  function applyKv(k,v){
    store.set(k,v);
    if(k==='ledger.cats'&&v&&Array.isArray(v.exp)&&Array.isArray(v.inc)){CATS.splice(0,CATS.length,...v.exp);INCS.splice(0,INCS.length,...v.inc)}
    else if(k==='ledger.accs'&&Array.isArray(v)&&v.length){ACCS.splice(0,ACCS.length,...v)}
    else if(k==='ledger.budgets'&&v&&typeof v==='object'){budgets=v}
    else if(k==='ledger.recurs'&&Array.isArray(v)){recurs=v}
  }
  async function run(manual){
    if(!on||!auth||busy)return;
    if(!navigator.onLine){if(manual)toast('当前没有网络');return}
    busy=true;setMsg('同步中…');
    try{
      await push();const ch=await pull();await push();
      M.last=Date.now();save();setMsg('已同步 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));
      if(ch)refreshAll();
      if(manual)toast('同步完成');
    }catch(e){setMsg('同步失败：'+e.message);if(manual)toast('同步失败：'+e.message)}
    finally{busy=false}
  }
  async function login(email,pw,signup){
    if(!email||!pw){toast('请输入邮箱和密码');return}
    try{
      setMsg(signup?'注册中…':'登录中…');
      const j=signup?await authReq('signup',{email,password:pw}):await authReq('token?grant_type=password',{email,password:pw});
      if(!j.access_token){toast('注册成功，请先去邮箱点确认链接，再回来登录');setMsg('');return}
      setAuth(j);
      const uidChanged=M.uid&&M.uid!==auth.uid;
      if(uidChanged||!M.uid){M.pull='';M.kvAt={};M.kv={};M.kvInit=false;M.dirty={}}
      M.uid=auth.uid;entries.forEach(e=>{M.dirty[String(e.id)]='u'});save();
      renderSet();toast('已登录，开始同步');run(true);
    }catch(e){setMsg('');toast((signup?'注册':'登录')+'失败：'+e.message)}
  }
  function logout(){auth=null;store.set('ledger.sb',null);clearTimeout(timer);renderSet();toast('已退出登录，本机数据保留')}
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function html(){
    if(!on)return `<div class="grp">云同步</div><p class="hint" style="margin-top:0">还没有配置 Supabase：把 Project URL 和 anon key 填进代码顶部的 SB_URL / SB_KEY 后，这里就能登录同步。</p>`;
    if(!auth)return `<div class="grp">云同步</div>
      <div class="hint" style="margin-top:0">登录后，账目会自动同步到你的 Supabase，换手机也能用。</div>
      <input class="fld" id="syEm" type="email" autocomplete="username" placeholder="邮箱" style="margin-bottom:8px">
      <input class="fld" id="syPw" type="password" autocomplete="current-password" placeholder="密码（至少 6 位）" style="margin-bottom:8px">
      <div class="bg-in"><button class="btn fill" id="syIn">登录</button><button class="btn" id="syUp">注册</button></div><p class="hint" id="syncSt">${esc(msg)}</p>`;
    return `<div class="grp">云同步</div>
      <button class="setrow" id="syNow">立即同步<span id="syncSt">${esc(msg||(M.last?'上次 '+new Date(M.last).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'尚未同步'))}</span></button>
      <button class="setrow" id="syOut">退出登录<span>${esc(auth.email||'')} ▸</span></button>`;
  }
  function bind(){
    if(!on)return;
    if(!auth){const em=$('#syEm'),pw=$('#syPw');$('#syIn').onclick=()=>login(em.value.trim(),pw.value,false);$('#syUp').onclick=()=>login(em.value.trim(),pw.value,true)}
    else{$('#syNow').onclick=()=>run(true);$('#syOut').onclick=logout}
  }
  syncMark=mark;syncKv=markKv;
  window.addEventListener('online',()=>sched(800));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)sched(800)});
  setInterval(()=>{if(!document.hidden)sched(100)},180000);
  return {on,run,html,bind,applying:false,start:()=>{if(on&&auth)sched(1200)}};
})();

(async function init(){
  await DB.open();
  if(DB.ok){
    try{
      const stored=await DB.all(),ids=new Set(stored.map(e=>e.id));
      const extra=entries.filter(e=>e&&e.id&&!ids.has(e.id));   // 旧的 localStorage 数据 / 加载期间新记的
      if(extra.length)await DB.put(extra);
      entries=stored.concat(extra);
      try{localStorage.removeItem('ledger.entries')}catch(e){}   // 迁移成功后才清掉旧数据
      try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
    }catch(err){DB.ok=false}
  }
  loaded=true;refreshAll();runRecurs();Sync.start();
  setTimeout(checkBackup,1500);
})();
render();
setInterval(()=>{if(!document.hidden){render();runRecurs()}},60000);
/* ---------- 系统“返回”手势 / 返回键：先关最上面一层，而不是直接退出页面 ---------- */
(function(){
  const LAY=[['dlg','#dlg'],['catEd','#catEd'],['accEd','#accEd'],['Pick','#sheetPick'],['Cur','#sheetCur'],['Detail','#sheetDetail'],
             ['Recur','#sheetRecur'],['Acc','#sheetAcc'],['Cats','#sheetCats'],['Set','#sheetSet'],['Stats','#sheetStats'],['Ledger','#sheetLedger'],['Add','#sheetAdd']];
  const isOn=el=>el.classList.contains('open')||el.classList.contains('show');
  let stack=[],guard=false,skip=0;
  function closeTop(){
    const n=stack[stack.length-1];if(!n)return;
    if(n==='dlg'){dlgRes&&dlgRes(false)}
    else if(n==='catEd'){closeCatEd()}
    else if(n==='accEd'){closeAccEd()}
    else if(n==='Pick'){closePick()}
    else closeSheet(n);
  }
  function sync(){
    LAY.forEach(([n,s])=>{
      const on=isOn($(s)),i=stack.indexOf(n);
      if(on&&i<0)stack.push(n);else if(!on&&i>=0)stack.splice(i,1);
    });
    if(stack.length&&!guard){history.pushState({ledgerLayer:1},'');guard=true}
    else if(!stack.length&&guard){
      setTimeout(()=>{if(!stack.length&&guard){guard=false;skip++;history.back()}},0);
    }
  }
  const mo=new MutationObserver(sync);
  LAY.forEach(([n,s])=>mo.observe($(s),{attributes:true,attributeFilter:['class']}));
  window.addEventListener('popstate',()=>{
    if(skip>0){skip--;return}
    guard=false;                      // 用户按了返回，守卫记录已被消耗
    closeTop();sync();
    if(stack.length&&!guard){history.pushState({ledgerLayer:1},'');guard=true}
  });
})();

/* ---------- PWA：离线缓存（仅在 https / localhost 下生效） ---------- */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}

document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();runRecurs()}});
})();
